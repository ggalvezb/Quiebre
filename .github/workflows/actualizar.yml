name: Actualizar datos

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC, cerca de las 07:30 en Chile continental
  workflow_dispatch:        # tambien se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # el cache guarda el XML ya descargado, asi cada corrida solo pide lo nuevo
      - name: Recuperar cache de la API
        uses: actions/cache@v4
        with:
          path: cache
          key: camara-xml-${{ github.run_id }}
          restore-keys: camara-xml-

      - name: Construir los datos
        run: python -m etl.build --desde 2026 --desde-fecha 2026-03-12

      - name: Publicar si hubo cambios
        run: |
          git config user.name "quiebre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Sin votaciones nuevas."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git push
          fi
